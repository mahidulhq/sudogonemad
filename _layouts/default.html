<!DOCTYPE html>
<html lang="en" class="dark scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ page.title | default: site.title }}</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        cyber: {
                            black: '#080c14',
                            dark: '#0f172a',
                            neon: '#00ff9d',
                            cyan: '#06b6d4'
                        }
                    },
                    fontFamily: { mono: ['Fira Code', 'JetBrains Mono', 'monospace'] }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
<body class="bg-[#080c14] text-slate-100 font-sans min-h-screen flex flex-col relative selection:bg-cyber-cyan selection:text-black">

    <canvas id="matrix-canvas" class="fixed top-0 left-0 w-full h-full opacity-20 pointer-events-none z-0"></canvas>

    <div class="relative z-10 flex flex-col min-h-screen">
        {% include header.html %}

        <main class="flex-grow">
            {{ content }}
        </main>

        {% include footer.html %}
    </div>

    <script src="{{ '/assets/js/matrix.js' | relative_url }}"></script>
</body>
</html>
